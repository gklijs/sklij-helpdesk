# A local, throwaway observability stack for skilj-helpdesk - entirely
# separate from scripts/dev.sh's "no Docker assumed" core-app path (see
# README.md's "Telemetry & dashboards" section): this is opt-in tooling
# to actually *see* the tracing/metrics skilj-core/skilj-rest/skilj
# already emit (skilj_helpdesk::telemetry wires it up when
# OTEL_EXPORTER_OTLP_ENDPOINT is set), not a requirement to run the app.
#
# Bring it up:      docker compose -f observability/docker-compose.yml up -d
# Point the app at it:
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# Grafana:          http://localhost:3000 (admin/admin, change-on-login
#                    disabled below - this never leaves localhost)
# Tear it down:      docker compose -f observability/docker-compose.yml down -v
#
# Nothing here persists across a `down -v` on purpose - this is a
# look-at-the-live-demo stack, not long-term storage.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP - what OTEL_EXPORTER_OTLP_ENDPOINT above points at
      - "8889:8889" # Prometheus exporter - scraped by prometheus below
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo's own query API (Grafana's datasource talks to this)

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
