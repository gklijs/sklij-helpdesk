# Scrapes the OTel Collector's own Prometheus exporter (see
# otel-collector-config.yaml) - the collector is the only real target
# here; nothing in this stack talks to skilj-helpdesk's binaries
# directly.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
