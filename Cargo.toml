[package]
name = "skilj-helpdesk"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Showcase SaaS helpdesk built on skilj - see README.md, then specs/skilj-helpdesk.allium."

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "alerter"
path = "src/bin/alerter.rs"

[[bin]]
name = "engagement-watcher"
path = "src/bin/engagement-watcher.rs"

[[bin]]
name = "lifecycle-replicator"
path = "src/bin/lifecycle-replicator.rs"

[[bin]]
name = "provisioner"
path = "src/bin/provisioner.rs"

[dependencies]
skilj = "0.0.9"
skilj-core = "0.0.9"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# src/bin/alerter.rs's own HTTP client, talking to a running skilj
# server's REST surface - and, second use, src/bin/server.rs's own
# optional demo-seed loop (SEED_DEMO_TRAFFIC=1), which is deliberately
# a real REST client of its own process rather than an in-process
# shortcut, so the fake traffic it generates shows up in the exact same
# HTTP-level telemetry (skilj-rest's REQUEST_DURATION, trace spans)
# real traffic would.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# src/bin/server.rs only - its own local JWKS/JWT shortcut, same
# reasoning as skilj-demo/src/bin/server.rs's own copy (its doc comment
# explains why). A real dependency, not a dev one: this ships in the
# `server` binary, not just tests.
jsonwebtoken = "9"
# src/bin/server.rs only - generates a fresh RSA keypair at startup for the
# local JWKS/JWT shortcut (no more hardcoded private key in source).
rsa = { version = "0.9", default-features = false, features = ["pem", "std"] }
# base64url for JWK modulus/exponent encoding.
base64 = "0.22"
# src/bin/server.rs only - CORS is a per-deployment policy decision
# (which origins to allow), not something skilj's own rest_router()/
# graphql_router() should bake in a global answer for - it's the
# consuming application's call, made where the two routers are merged.
# Found the hard way: a real browser (frontend/, a different origin
# from the server) blocks the response outright without this.
tower-http = { version = "0.6", features = ["cors"] }
# src/bin/server.rs only - concurrency-limit + load-shed on the merged
# router, same "consuming application's call" reasoning as tower-http
# above: once the DB pool (skilj_core::db) is saturated, this is what
# makes the server fail fast (503) instead of queuing unboundedly many
# in-flight requests in memory (see docs/load-test-report-2026-09-17.md).
tower = { version = "0.5", features = ["limit", "load-shed"] }
# src/routing_guard.rs only - buffers at most MAX_INSPECTED_BODY of a
# GraphQL body and, when it is larger, hands the downstream router the
# buffered prefix chained with the unread rest (already in the tree via
# axum/reqwest).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Telemetry (src/telemetry.rs, used by every binary) - versions
# pinned to match skilj 0.0.9's own Cargo.toml exactly. skilj-core/skilj-rest/
# skilj only ever call opentelemetry::global::meter()/global tracer -
# they never install a subscriber or MeterProvider themselves (see
# docs/architecture.md's tracing section) - init_telemetry below is
# this crate's own copy of skilj-demo/src/bin/server.rs's reference
# wiring that actually does. A version mismatch against skilj-core's
# own opentelemetry dependency would make global::meter() resolve to a
# different, incompatible API, so these can't float independently.
# 0.0.9 moved the whole stack 0.32 -> 0.33 (tracing-opentelemetry
# 0.33 -> 0.34) with no call-site changes here, and warned explicitly
# that an application still installing a 0.32 provider would silently
# receive none of skilj's spans or metrics - the globals are per crate
# version, so this isn't a compile error, it's a silent no-op.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "metrics"] }
tracing-opentelemetry = "0.34"
opentelemetry-appender-tracing = "0.33"

[dev-dependencies]
postgresql_embedded = "0.21.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# tests/fixture/ only - given/when/then tests for every decide()/project()
# in this crate, with no database and no HTTP (docs/architecture.md §45
# in the skilj repo). Complements, doesn't replace, the Postgres-backed
# tests/*.rs suites, which still own persistence, DCB conflicts and
# access control.
skilj-test-fixture = "0.0.9"
# tests/ticket_auto_close_cancel.rs only - reads the `deadlines` table
# directly, since no skilj API lists pending deadlines. Same version as
# skilj 0.0.9's own Cargo.toml, so it resolves to the copy skilj-core already
# builds; features are unified with skilj-core's own.
sqlx = { version = "0.9", default-features = false, features = ["postgres"] }
