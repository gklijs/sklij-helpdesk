[package]
name = "skilj-helpdesk-frontend"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = """
The one role-based web frontend for skilj-helpdesk (customer portal and
staff dashboard in a single app, per the chosen shape - see this repo's
own notes). A separate crate from the backend on purpose: this targets
wasm32-unknown-unknown and pulls in an entirely different dependency
tree (Leptos, web-sys) that the server/alerter/scheduler binaries have
no business depending on - same crate-separation reasoning skilj-tui
gets in the main skilj repo. Not part of any Cargo workspace with the
backend crate either, for the same reason.

Built with Leptos (CSR) + trunk. Talks to the skilj server's /graphql
endpoint directly - no backend-for-frontend layer, since skilj-graphql
already is the API this needs. Authenticates against a real external
OIDC provider (Dex, see ../dex/config.yaml) via Authorization Code +
PKCE - the frontend is a public client (no secret, can't keep one in
WASM shipped to a browser).

Run: `trunk serve` (dev server, defaults to port 8081 - see Trunk.toml).
Needs a skilj-helpdesk server running with OIDC_ISSUER_URL set to a
running Dex instance (see ../src/bin/server.rs's own doc comment) - the
two are separate processes, same as alerter/scheduler are.
"""

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Url", "UrlSearchParams"] }
js-sys = "0.3"
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
