<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkilJ Helpdesk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --brand: #4f46e5;
        --brand-dark: #3730a3;
        --brand-light: #eef2ff;
        --ink: #1e1b2e;
        --muted: #6b7280;
        --border: #e5e7eb;
        --bg: #f9fafb;
        --surface: #ffffff;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --warn: #b45309;
        --warn-bg: #fffbeb;
        --ok: #15803d;
        --ok-bg: #f0fdf4;
        --info: #1d4ed8;
        --info-bg: #eff6ff;
      }

      * { box-sizing: border-box; }

      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        max-width: 880px;
        margin: 0 auto;
        padding: 0 1.25rem 3rem;
        line-height: 1.5;
      }

      h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
      h1::before {
        content: "S";
        display: inline-grid;
        place-items: center;
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 0.4rem;
        background: var(--brand);
        color: white;
        font-weight: 700;
        font-size: 1rem;
      }
      h2 { font-size: 1.05rem; margin: 1.75rem 0 0.75rem; color: var(--brand-dark); }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0.5rem;
      }
      nav span { color: var(--muted); font-size: 0.9rem; }

      .table-wrap { overflow-x: auto; margin-top: 0.5rem; border-radius: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--surface); min-width: 40rem; }
      th { text-align: left; padding: 0.6rem 0.8rem; background: var(--brand-light); color: var(--brand-dark); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
      td { text-align: left; padding: 0.6rem 0.8rem; border-top: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
      th:nth-child(1), td:nth-child(1) { width: 20%; }
      th:nth-child(2), td:nth-child(2) { width: 20%; }
      th:nth-child(3), td:nth-child(3) { width: 9%; }
      th:nth-child(4), td:nth-child(4) { width: 15%; }
      th:nth-child(5), td:nth-child(5) { width: 15%; }
      th:nth-child(6), td:nth-child(6) { width: 17%; }

      .ticket-detail { background: #fcfcfe; }
      .ticket-detail .description { color: var(--muted); margin: 0 0 0.5rem; }
      .messages { list-style: none; margin: 0 0 0.5rem; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
      .messages li { padding: 0.4rem 0.6rem; border-radius: 0.4rem; font-size: 0.9rem; max-width: 32rem; }
      .messages li.from-staff { background: var(--info-bg); color: var(--info); }
      .messages li.from-customer { background: var(--brand-light); color: var(--brand-dark); }
      .reply-form { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
      .reply-form input { flex: 1; }

      button {
        cursor: pointer;
        padding: 0.4rem 0.75rem;
        margin: 0 0.3rem 0.3rem 0;
        border: 1px solid var(--brand);
        background: var(--surface);
        color: var(--brand);
        border-radius: 0.4rem;
        font-size: 0.85rem;
        font-weight: 600;
        transition: background 0.1s, color 0.1s;
      }
      button:hover { background: var(--brand); color: white; }
      nav button { border-color: var(--border); color: var(--muted); }
      nav button:hover { background: var(--ink); border-color: var(--ink); color: white; }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1rem;
      }
      input, textarea, select {
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        font: inherit;
      }
      input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
      form button { align-self: flex-start; }

      .badge {
        display: inline-block;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: capitalize;
        white-space: nowrap;
      }
      td button { white-space: nowrap; }
      td:nth-child(4), td:nth-child(5) { overflow-wrap: normal; word-break: keep-all; }
      .badge.status-open { background: var(--info-bg); color: var(--info); }
      .badge.status-in_progress { background: var(--brand-light); color: var(--brand-dark); }
      .badge.status-waiting_on_customer { background: var(--warn-bg); color: var(--warn); }
      .badge.status-resolved, .badge.status-closed { background: var(--ok-bg); color: var(--ok); }

      .badge.priority-low { background: #f3f4f6; color: #4b5563; }
      .badge.priority-medium { background: var(--info-bg); color: var(--info); }
      .badge.priority-high { background: var(--warn-bg); color: var(--warn); }
      .badge.priority-urgent { background: var(--danger-bg); color: var(--danger); }

      .error { color: var(--danger); background: var(--danger-bg); padding: 0.5rem 0.75rem; border-radius: 0.4rem; }
      .error:empty { display: none; }

      ul.demo-accounts { color: var(--muted); font-size: 0.9rem; }
      ul.demo-accounts code { background: var(--brand-light); color: var(--brand-dark); padding: 0.1rem 0.35rem; border-radius: 0.25rem; }
    </style>
  </head>
  <body></body>
</html>
